name: Deploy Acionar Backend v3 (NestJS + Prisma) to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build Verification
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/acionar_v3"
        run: |
          npm install --legacy-peer-deps
          npx prisma generate
          npm run build

      - name: Deploy & Restart Backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "76.13.230.110"
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/acionar-v3/backend
            git pull origin main
            npm install --legacy-peer-deps
            npx prisma generate
            npx prisma db push --accept-data-loss
            npm run build
            pm2 describe acionar-backend-v3 > /dev/null 2>&1 && pm2 reload acionar-backend-v3 || pm2 start dist/main.js --name acionar-backend-v3
            pm2 save
